name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  latest-deps:
    name: Test (latest compatible deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update
      - run: cargo test --all-features

  minimal-versions:
    name: Test (minimal direct deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Nightly resolves the lockfile; the suite itself runs on stable,
      # which is installed second so it stays the default toolchain.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions
      # `latest-deps` checks the top of each caret range and the committed
      # lockfile checks one point inside it; this checks the bottom, which
      # is what the MSRV claim rests on. `--direct` leaves transitive
      # crates at their normal versions: several do not build at their own
      # floor, and none of those floors are this crate's to claim.
      - run: cargo minimal-versions test --all-features --direct

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # Running the suite, not just checking it, so that test-only use of
      # an API newer than the MSRV is caught too.
      - run: cargo test --all-features

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      # The same check RELEASING.md runs before a publish, run on every
      # change: the public API is compared against the released baseline,
      # so a breaking change has to be paired with a version bump.
      - run: cargo semver-checks check-release

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      # Not in install-action's tool list; binstall fetches a prebuilt
      # binary rather than rebuilding it on every cache miss.
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall --no-confirm cargo-fuzz
      # Seed from the selectors the test suite already covers, so the
      # budget goes on mutations of real syntax.
      - run: ./fuzz/seed-corpus.sh
      # `cargo fuzz` defaults `--target` to the triple *it* was built for,
      # and the prebuilt binary binstall fetches is a musl build. Building
      # the target for musl fails: the sanitizer cannot be linked against a
      # static libc, and the musl std is not installed anyway. Pin the
      # target to the host triple instead.
      - run: cargo fuzz run --target "$(rustc -vV | awk '/^host:/{print $2}')" translate -- -max_total_time=120 -max_len=4096
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # A floor well under the ~97% the suite reaches today: the gate is
      # for a change that drops whole paths, not for the last few lines.
      - run: cargo llvm-cov --all-features --fail-under-lines 90 --lcov --output-path lcov.info
      - if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
