[package]
name = "css-to-xpath"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Translate CSS selectors to XPath 1.0 expressions"
license = "MIT"
repository = "https://github.com/sjp/css-to-xpath"
documentation = "https://docs.rs/css-to-xpath"
readme = "README.md"
keywords = ["css", "xpath", "selectors", "html", "xml"]
categories = ["parser-implementations", "web-programming", "text-processing"]
include = ["/src/**/*.rs", "/Cargo.toml", "/LICENSE", "/README.md"]

[dependencies]
selectors = "0.40"
cssparser = "0.37"
unicode-width = "0.2"
precomputed-hash = "0.1"

[profile.release]
panic = "unwind"

[dev-dependencies]
proptest = "1.11.0"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
