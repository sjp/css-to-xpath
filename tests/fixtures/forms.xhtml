<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fixture for Mode::Xhtml: XHTML served as XML, so element names live in
  the XHTML namespace and the language comes from xml:lang.

  Type selectors are therefore written xhtml|input in the test cases; an
  unprefixed `input` means the null namespace and matches nothing here.
  The HTML pseudo-class translations match on local-name(), so they are
  namespace-agnostic and need no prefix.

  The form is arranged around the awkward corners of :disabled — a
  disabled fieldset, its first legend (carved out) versus a second one
  (not carved out), a disabled optgroup's options (including one that is
  not its child), and a disabled select's.
-->
<html xmlns="http://www.w3.org/1999/xhtml" id="doc" xml:lang="en">
  <head id="hd">
    <!-- A `link` carries an @href, but HTML's :link/:visited set is the
         `a` and `area` elements only, so it matches neither. -->
    <link id="lk" href="#x"/>
  </head>
  <body id="body">
    <form id="f1">
      <fieldset id="fs1" disabled="disabled">
        <legend id="lg1"><input id="i1" type="text"/></legend>
        <legend id="lg2"><input id="i2" type="text"/></legend>
        <input id="i3" type="text"/>
      </fieldset>
      <fieldset id="fs2">
        <input id="i4" type="checkbox" checked="checked"/>
        <input id="i5" type="radio"/>
        <input id="i6" type="text" required="required"/>
        <input id="i7" type="hidden" required="required"/>
        <!-- `disabled` applies to every input type, Hidden included, so
             i8 is :disabled where i7, the same type without it, is
             :enabled. `required` is the attribute the type decides. -->
        <input id="i8" type="hidden" disabled="disabled"/>
        <select id="se1">
          <optgroup id="og1" disabled="disabled">
            <option id="o1" selected="selected">A</option>
            <option id="o2">B</option>
            <!-- Not a child of the optgroup: the disabledness of an
                 option is settled by the nearest optgroup above it, so
                 o4 is disabled where d1, not being an option, is
                 neither :disabled nor :enabled. -->
            <div id="d1"><option id="o4">D</option></div>
          </optgroup>
          <optgroup id="og2">
            <option id="o3">C</option>
          </optgroup>
        </select>
        <!-- A disabled select disables the options and optgroups
             inside it, which is how a whole control is switched off. -->
        <select id="se2" disabled="disabled">
          <option id="o5">E</option>
          <optgroup id="og3"><option id="o6">F</option></optgroup>
        </select>
        <button id="bt1" disabled="disabled">Go</button>
        <textarea id="ta1" required="required"></textarea>
      </fieldset>
    </form>
    <a id="a1" href="#x">link</a>
    <a id="a2">not a link</a>
    <p id="p1" xml:lang="fr-Latn-CA">bonjour</p>
    <p id="p2" lang="de">hallo</p>
    <!-- xml:lang wins over lang on the same element even when it is
         empty, so p3's language is unknown rather than `fr`. -->
    <p id="p3" xml:lang="" lang="fr">rien</p>
  </body>
</html>
